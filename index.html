<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Katalog Produk</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f6f7f9;
  color:#171717
}
header{
  background:#fff;
  padding:16px 18px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:1px solid #ddd;
  position:sticky;
  top:0;
  z-index:5
}
main{
  max-width:1100px;
  margin:auto;
  padding:26px 16px
}
.hero{
  background:#171717;
  color:#fff;
  border-radius:26px;
  padding:30px 26px;
  margin-bottom:28px
}
.hero h1{
  margin:0 0 12px;
  font-size:38px
}
.hero p{
  margin:0;
  font-size:18px
}
.search{
  width:100%;
  padding:20px;
  border:1px solid #ddd;
  border-radius:18px;
  font-size:18px;
  margin-bottom:16px
}
.cats{
  display:flex;
  gap:8px;
  overflow:auto;
  margin-bottom:20px
}
.cats button{
  border:1px solid #ddd;
  background:#fff;
  border-radius:12px;
  padding:10px 16px;
  white-space:nowrap
}
.cats button.active{
  background:#171717;
  color:#fff
}
.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:14px
}
.card{
  background:#fff;
  border:1px solid #e3e3e3;
  border-radius:16px;
  overflow:hidden
}
.pic{
  height:180px;
  background:#eee;
  display:flex;
  align-items:center;
  justify-content:center
}
.pic img{
  width:100%;
  height:100%;
  object-fit:contain
}
.cardbody{
  padding:14px
}
.brand{
  color:#777;
  font-size:13px
}
.name{
  font-size:17px;
  font-weight:bold;
  margin:5px 0
}
.price{
  font-size:19px;
  font-weight:bold;
  margin-top:10px
}
.meta{
  color:#666;
  font-size:13px;
  margin-top:6px
}
.empty{
  padding:40px;
  text-align:center;
  color:#777
}
.adminbar{
  display:none;
  gap:8px;
  margin-bottom:20px
}
.adminbar button{
  padding:10px 14px;
  border:0;
  border-radius:10px
}
@media(max-width:700px){
  .grid{grid-template-columns:repeat(2,1fr)}
  .hero h1{font-size:34px}
}
</style>
</head>

<body>

<header>
  <b>KATALOG ANDA</b>
  <button onclick="adminLogin()">🔒 Admin</button>
</header>

<main>

<section class="hero">
  <h1>Katalog Produk</h1>
  <p>Tambah dan edit produk melalui Admin.</p>
</section>

<div id="adminbar" class="adminbar">
  <button onclick="addProduct()">➕ Tambah Produk</button>
  <button onclick="logout()">Keluar</button>
</div>

<input
  id="search"
  class="search"
  placeholder="Cari produk..."
  oninput="render()"
>

<div id="cats" class="cats"></div>

<div id="grid" class="grid"></div>

</main>

<script>

const SUPABASE_URL =
"https://kyzoscnnezuzewvknxuh.supabase.co/rest/v1/";

const SUPABASE_KEY =
"sb_publishable_-TmUC7SdN6m4fTLEasIgG_VfYFcap";

let data=[];
let isAdmin=false;
let selectedCategory="Semua";

async function loadData(){

  try{

    const r=await fetch(
      SUPABASE_URL+"products?select=*",
      {
        method:"GET",
        headers:{
          "apikey":SUPABASE_KEY,
          "Authorization":"Bearer "+SUPABASE_KEY,
          "Content-Type":"application/json"
        }
      }
    );

    if(!r.ok){
      const errorText=await r.text();
      throw new Error("Supabase HTTP "+r.status+": "+errorText);
    }

    const rows=await r.json();

    data=rows.map(x=>({
      id:x.id,
      n:x.name || "",
      b:x.brand || "",
      c:x.category || "",
      p:x.price_ctn || 0,
      i:x.pack || "",
      img:x.image_url || ""
    }));

    render();

  }catch(e){

    console.error(e);

    document.getElementById("grid").innerHTML=
      '<div class="empty">Gagal mengambil data dari Supabase.<br><br>'+
      e.message+'</div>';

  }
}

function render(){

  const q=
    document.getElementById("search").value
    .toLowerCase();

  const cats=
    ["Semua",
     ...new Set(
       data.map(x=>x.c).filter(Boolean)
     )
    ];

  document.getElementById("cats").innerHTML=
    cats.map(c=>
      `<button class="${selectedCategory===c?'active':''}"
       onclick="selectedCategory='${esc(c)}';render()">
       ${esc(c)}
       </button>`
    ).join("");

  const filtered=data.filter(x=>{

    const cocokSearch=
      (x.n+" "+x.b).toLowerCase().includes(q);

    const cocokCat=
      selectedCategory==="Semua" ||
      x.c===selectedCategory;

    return cocokSearch && cocokCat;

  });

  if(!filtered.length){

    document.getElementById("grid").innerHTML=
      '<div class="empty">Belum ada produk.</div>';

    return;
  }

  document.getElementById("grid").innerHTML=
    filtered.map(x=>`

      <article class="card">

        <div class="pic">
          ${
            x.img
            ? `<img src="${esc(x.img)}"
                    onerror="this.style.display='none'">`
            : "📦"
          }
        </div>

        <div class="cardbody">

          <div class="brand">${esc(x.b)}</div>

          <div class="name">${esc(x.n)}</div>

          <div class="price">
            Rp ${Number(x.p||0).toLocaleString("id-ID")} / CTN
          </div>

          ${
            x.i
            ? `<div class="meta">Isi: ${esc(x.i)} PCS</div>`
            : ""
          }

          ${
            isAdmin
            ? `<div style="margin-top:12px">
                <button onclick="editProduct(${x.id})">
                  ✏️ Edit
                </button>
                <button onclick="deleteProduct(${x.id})">
                  🗑️ Hapus
                </button>
              </div>`
            : ""
          }

        </div>

      </article>

    `).join("");
}

function esc(s){

  return String(s??"")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}

function adminLogin(){

  const p=prompt("Password admin:");

  if(p==="admin123"){

    isAdmin=true;
    document.getElementById("adminbar").style.display="flex";
    render();

  }else if(p!==null){

    alert("Password salah");

  }
}

function logout(){

  isAdmin=false;
  document.getElementById("adminbar").style.display="none";
  render();

}

async function addProduct(){

  if(!isAdmin)return;

  const name=prompt("Nama produk:");
  if(!name)return;

  const brand=prompt("Brand:");
  const category=prompt("Kategori:");
  const price=prompt("Harga CTN:");
  const pack=prompt("Isi per CTN:");
  const image=prompt("URL gambar (boleh kosong):");

  const payload={
    name:name,
    brand:brand||"",
    category:category||"",
    price_ctn:Number(price)||0,
    pack:pack||"",
    image_url:image||""
  };

  const r=await fetch(
    SUPABASE_URL+"products",
    {
      method:"POST",
      headers:{
        "apikey":SUPABASE_KEY,
        "Authorization":"Bearer "+SUPABASE_KEY,
        "Content-Type":"application/json",
        "Prefer":"return=minimal"
      },
      body:JSON.stringify(payload)
    }
  );

  if(!r.ok){

    alert("Gagal menambah produk:\n"+await r.text());
    return;

  }

  await loadData();
  alert("Produk berhasil ditambahkan.");

}

async function editProduct(id){

  const x=data.find(a=>a.id==id);

  if(!x)return;

  const name=prompt("Nama produk:",x.n);
  if(!name)return;

  const brand=prompt("Brand:",x.b);
  const category=prompt("Kategori:",x.c);
  const price=prompt("Harga CTN:",x.p);
  const pack=prompt("Isi per CTN:",x.i);
  const image=prompt("URL gambar:",x.img);

  const payload={
    name:name,
    brand:brand||"",
    category:category||"",
    price_ctn:Number(price)||0,
    pack:pack||"",
    image_url:image||""
  };

  const r=await fetch(
    SUPABASE_URL+"products?id=eq."+id,
    {
      method:"PATCH",
      headers:{
        "apikey":SUPABASE_KEY,
        "Authorization":"Bearer "+SUPABASE_KEY,
        "Content-Type":"application/json"
      },
      body:JSON.stringify(payload)
    }
  );

  if(!r.ok){

    alert("Gagal mengedit:\n"+await r.text());
    return;

  }

  await loadData();
  alert("Produk berhasil diubah.");

}

async function deleteProduct(id){

  if(!confirm("Hapus produk ini?"))return;

  const r=await fetch(
    SUPABASE_URL+"products?id=eq."+id,
    {
      method:"DELETE",
      headers:{
        "apikey":SUPABASE_KEY,
        "Authorization":"Bearer "+SUPABASE_KEY
      }
    }
  );

  if(!r.ok){

    alert("Gagal menghapus:\n"+await r.text());
    return;

  }

  await loadData();

}

loadData();

</script>

</body>
</html>
