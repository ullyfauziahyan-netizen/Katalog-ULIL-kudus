<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Katalog Produk</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f6f7f9;color:#171717}header{background:#fff;padding:16px 18px;display:flex;justify-content:space-between;position:sticky;top:0;z-index:5;border-bottom:1px solid #ddd}main{max-width:1100px;margin:auto;padding:18px}.hero{background:#171717;color:#fff;border-radius:16px;padding:26px;margin-bottom:16px}.hero h1{margin:0 0 6px}.search{width:100%;padding:13px;border:1px solid #ddd;border-radius:10px;font-size:15px}.cats{display:flex;gap:8px;overflow:auto;margin:10px 0 16px}.cats button{white-space:nowrap;padding:8px 12px;border:1px solid #ddd;background:white;border-radius:9px}.cats .on{background:#171717;color:white}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:#fff;border:1px solid #e3e3e3;border-radius:14px;overflow:hidden}.pic{height:180px;background:#eee;display:flex;align-items:center;justify-content:center;color:#999;font-size:35px}.pic img{width:100%;height:100%;object-fit:contain}.body{padding:12px}.body small,.meta{color:#777;font-size:11px}.body h3{font-size:14px;min-height:35px}.price{font-weight:bold}.add{width:100%;padding:9px;background:#171717;color:white;border:0;border-radius:8px}.admin{background:#fff;border:1px dashed #999;padding:10px;border-radius:10px;margin:12px 0}.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}.box{background:#fff;padding:22px;border-radius:15px;width:min(600px,100%);max-height:90vh;overflow:auto}.box input{width:100%;padding:10px;margin:5px 0 10px;border:1px solid #ddd;border-radius:8px}.save{width:100%;padding:11px;background:#171717;color:#fff;border:0;border-radius:9px}.edit{display:flex;gap:5px;margin-top:8px}.edit button{padding:7px;border:1px solid #ddd;background:white;border-radius:7px}@media(max-width:850px){.grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:600px){.grid{grid-template-columns:repeat(2,1fr)}.pic{height:145px}}
</style></head><body>
<header><b>KATALOG ANDA</b><button onclick="adminLogin()">🔒 Admin</button></header><main><section class="hero"><h1>Katalog Produk</h1><p>Tambah dan edit produk melalui Admin.</p></section><input id="q" class="search" placeholder="Cari produk..." oninput="render()"><div id="cats" class="cats"></div><div id="admin"></div><div id="grid" class="grid"></div></main><div id="modal"></div>
<script>
  alert("JAVASCRIPT BERJALAN");

const SUPABASE_URL="https://kyzoscnnezuzewvknxuh.supabase.co/rest/v1/";
  const SUPABASE_KEY="sb_publishable_-TmUC7SdNF6m4fTLEasIGg_YFfEYcaP";
const K="katalog_data";
let data=[];

async function loadData(){
  try{
    alert("MULAI HUBUNG SUPABASE");

    const controller=new AbortController();
    const timer=setTimeout(()=>controller.abort(),10000);

    const r=await fetch(SUPABASE_URL+"products?select=*",{
      headers:{
        "apikey":SUPABASE_KEY,
        "Authorization":"Bearer "+SUPABASE_KEY
      },
      signal:controller.signal
    });

    clearTimeout(timer);

    alert("SUPABASE MERESPONS. STATUS: "+r.status);

    if(!r.ok) throw new Error(await r.text());

    const rows=await r.json();

    alert("JUMLAH DATA: "+rows.length);

    data=rows.map(x=>({
      id:x.id,
      n:x.name,
      b:x.brand,
      c:x.category,
      p:x.price_ctn,
      i:x.pack,
      img:x.image_url||""
    }));

    render();

  }catch(e){
    alert("ERROR: "+e.message);
    console.error(e);
    data=[];
    render();
  }
}
const esc=s=>String(s??"").replace(/[&<>"]/g,x=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[x]));
function save(){localStorage.setItem(K,JSON.stringify(data))}
function render(){let q=document.getElementById("q").value.toLowerCase(),cs=["Semua",...new Set(data.map(x=>x.c).filter(Boolean))];document.getElementById("cats").innerHTML=cs.map(x=>`<button class="${x==cat?"on":""}" onclick="cat='${esc(x)}';render()">${esc(x)}</button>`).join("");let a=data.filter(x=>(cat=="Semua"||x.c==cat)&&x.n.toLowerCase().includes(q));document.getElementById("grid").innerHTML=a.map(x=>`<article class="card"><div class="pic">${x.img?`<img src="${x.img}">`:"📦"}</div><div class="body"><small>${esc(x.b||"—")} · ${esc(x.c||"—")}</small><h3>${esc(x.n)}</h3><div class="price">${rp(x.p)} / CTN</div><div class="meta">Isi ${x.i||1} PCS · ± ${rp((x.p||0)/(x.i||1))}/PCS</div><button class="add" onclick="alert('Produk ditambahkan: ${esc(x.n)}')">＋ Tambah</button>${isAdmin?`<div class="edit"><button onclick="edit(${x.id})">✏️ Edit</button><button onclick="del(${x.id})">🗑️</button></div>`:""}</div></article>`).join("")||"<p>Produk tidak ditemukan.</p>";document.getElementById("admin").innerHTML=isAdmin?`<div class="admin"><b>MODE ADMIN</b> <button onclick="edit()">＋ Tambah Produk</button> <button onclick="isAdmin=false;render()">Keluar</button></div>`:""}
function adminLogin(){if(prompt("Password admin:")==="admin123"){isAdmin=true;render()}else alert("Password salah")}
function del(id){if(confirm("Hapus produk?")){data=data.filter(x=>x.id!==id);save();render()}}
function edit(id){let x=id?data.find(a=>a.id===id):{id:0,n:"",b:"",c:"",p:0,i:1,img:""};window.img=x.img||"";document.getElementById("modal").innerHTML=`<div class="modal"><div class="box"><h2>${id?"Edit":"Tambah"} Produk</h2><label>Nama<input id="n" value="${esc(x.n)}"></label><label>Brand<input id="b" value="${esc(x.b)}"></label><label>Kategori<input id="c" value="${esc(x.c)}"></label><label>Harga CTN<input id="p" type="number" value="${x.p}"></label><label>Isi CTN<input id="i" type="number" value="${x.i}"></label><label>Foto<input id="f" type="file" accept="image/*" onchange="photo(this)"></label><img id="pr" src="${esc(x.img)}" style="max-width:130px;max-height:130px"><button class="save" onclick="saveEdit(${x.id})">Simpan</button><button onclick="closeM()">Batal</button></div></div>`}
function photo(el){let r=new FileReader;r.onload=()=>{window.img=r.result;document.getElementById("pr").src=r.result};r.readAsDataURL(el.files[0])}
function saveEdit(id){let x={id:id||Date.now(),n:document.getElementById("n").value,b:document.getElementById("b").value,c:document.getElementById("c").value,p:+document.getElementById("p").value||0,i:+document.getElementById("i").value||1,img:window.img||""};data=id?data.map(a=>a.id==id?x:a):[...data,x];save();closeM();render()}
function closeM(){document.getElementById("modal").innerHTML=""}render();
document.body.insertAdjacentHTML("beforeend","<h2 style='padding:20px;color:red'>LOADDATA TERPANGGIL</h2>");
alert("LOADDATA DIPANGGIL");
loadData();
</script></body></html>
