<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Katalog Produk</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f6f7f9;
  color:#171717
}
header{
  background:#fff;
  padding:16px 18px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:1px solid #ddd;
  position:sticky;
  top:0;
  z-index:5
}
main{
  max-width:1100px;
  margin:auto;
  padding:26px 16px
}
.hero{
  background:#171717;
  color:#fff;
  border-radius:26px;
  padding:30px 26px;
  margin-bottom:28px
}
.hero h1{
  margin:0 0 12px;
  font-size:38px
}
.hero p{
  margin:0;
  font-size:18px
}
.search{
  width:100%;
  padding:20px;
  border:1px solid #ddd;
  border-radius:18px;
  font-size:18px;
  margin-bottom:16px;
  position:sticky;
  top:64px;
  z-index:10;
  background:#f6f7f9;
}
.search{
  display:none;
}

.search.searchVisible{
  display:block;
}  
.cats{
  display:flex;
  gap:8px;
  overflow:auto;
  margin-bottom:20px;
  position:sticky;
  top:145px;
  z-index:9;
  background:#f6f7f9;
  padding:6px 0 10px;
}
.cats button{
  border:1px solid #ddd;
  background:#fff;
  border-radius:12px;
  padding:10px 16px;
  white-space:nowrap
}
.cats button.active{
  background:#171717;
  color:#fff
}
.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:14px
}
.card{
  background:#fff;
  border:1px solid #e3e3e3;
  border-radius:16px;
  overflow:hidden
}
.pic{
  height:180px;
  background:#eee;
  display:flex;
  align-items:center;
  justify-content:center
}
.pic img{
  width:100%;
  height:100%;
  object-fit:contain
}
.cardbody{
  padding:14px
}
.brand{
  color:#777;
  font-size:13px
}
.name{
  font-size:17px;
  font-weight:bold;
  margin:5px 0
}
.price{
  font-size:19px;
  font-weight:bold;
  margin-top:10px
}
.meta{
  color:#666;
  font-size:13px;
  margin-top:6px
}
  .cart{
  background:#fff;
  border:1px solid #ddd;
  border-radius:16px;
  padding:16px;
  margin-bottom:20px;
}
/* KERANJANG HANYA MUNCUL SAAT IKON DIKLIK */
.cart{
  display:none;
}

.cart.cartOpen{
  display:block;
}
.cart:empty{
  display:none;
}

.cartItem{
  padding:14px 0;
  border-bottom:1px solid #eee;
  display:flex;
  gap:12px;
  align-items:center;
}

.cartImage{
  width:75px;
  height:75px;
  flex-shrink:0;
  background:#f5f5f5;
  border-radius:10px;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  font-size:28px;
}

.cartImage img{
  width:100%;
  height:100%;
  object-fit:contain;
}

.cartInfo{
  flex:1;
  min-width:0;
}

.cartName{
  font-weight:bold;
  font-size:15px;
  margin-bottom:5px;
}

.cartMeta{
  color:#666;
  font-size:13px;
  margin-bottom:4px;
}

.cartPrice{
  font-size:13px;
  color:#666;
}

.cartSubtotal{
  font-weight:bold;
  font-size:15px;
  margin-top:5px;
}

.cartDelete{
  flex-shrink:0;
  padding:8px 10px;
}

.cartTotal{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-top:16px;
  padding-top:12px;
  border-top:2px solid #eee;
}
.empty{
  padding:40px;
  text-align:center;
  color:#777
}
.adminbar{
  display:none;
  gap:8px;
  margin-bottom:20px
}
.adminbar button{
  padding:10px 14px;
  border:0;
  border-radius:10px
}
@media(max-width:700px){
  .grid{grid-template-columns:repeat(2,1fr)}
  .hero h1{font-size:34px}
}
  /* ADMIN FORM */
.adminList{
  margin-top:20px;
}

.adminTools{
  background:#fff;
  border:1px solid #ddd;
  border-radius:16px;
  padding:16px;
  margin-bottom:20px;
}

.adminTools input{
  width:100%;
  box-sizing:border-box;
  padding:12px;
  border:1px solid #ddd;
  border-radius:10px;
  font-size:16px;
  margin-bottom:10px;
}

.adminFilters{
  display:flex;
  gap:8px;
  overflow:auto;
}

.adminFilters button{
  white-space:nowrap;
  padding:9px 12px;
  border:1px solid #ddd;
  border-radius:10px;
  background:#fff;
}

.adminRow{
  background:#fff;
  border:1px solid #ddd;
  border-radius:14px;
  padding:12px;
  margin-bottom:10px;
  display:flex;
  gap:12px;
  align-items:center;
}

.adminThumb{
  width:60px;
  height:60px;
  border-radius:10px;
  object-fit:contain;
  background:#f5f5f5;
}

.adminInfo{
  flex:1;
  min-width:0;
}

.adminName{
  font-weight:bold;
  margin-bottom:5px;
}

.adminStatus{
  font-size:13px;
  margin-top:5px;
}

.statusOK{
  color:green;
}

.statusMissing{
  color:#d97706;
}

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.6);
  display:none;
  align-items:center;
  justify-content:center;
  padding:15px;
  z-index:100;
}

.modalBox{
  background:#fff;
  width:100%;
  max-width:600px;
  max-height:90vh;
  overflow:auto;
  border-radius:18px;
  padding:20px;
  box-sizing:border-box;
}

.formGrid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.formGroup{
  display:flex;
  flex-direction:column;
  gap:5px;
}

.formGroup.full{
  grid-column:1/-1;
}

.formGroup input{
  padding:11px;
  border:1px solid #ccc;
  border-radius:9px;
  font-size:15px;
  box-sizing:border-box;
}

.preview{
  width:100%;
  height:160px;
  object-fit:contain;
  background:#f5f5f5;
  border-radius:10px;
  margin-top:8px;
}

.modalButtons{
  display:flex;
  gap:10px;
  margin-top:16px;
}

.modalButtons button{
  flex:1;
  padding:12px;
  border:0;
  border-radius:10px;
}

@media(max-width:700px){
  .formGrid{
    grid-template-columns:1fr;
  }

  .formGroup.full{
    grid-column:auto;
  }

  .adminRow{
    align-items:flex-start;
  }
}
 /* ===== MOBILE UX TOOLBAR ===== */

.mobileTools{
  display:flex;
  gap:12px;
  margin:0 0 14px;
}

.toolBtn{
  flex:1;
  min-height:64px;
  border:1px solid #ddd;
  background:#fff;
  border-radius:16px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:4px;
  font-size:13px;
  cursor:pointer;
  transition:.2s;
}

.toolBtn:active{
  transform:scale(.97);
}

.toolIcon{
  font-size:25px;
  line-height:1;
}

.toolBtn.active{
  border-color:#1683ff;
  background:#eef7ff;
  color:#0878ef;
}

#search{
  transition:.25s;
}

.searchHidden{
  display:none !important;
}

.searchVisible{
  display:block !important;
  animation:searchIn .2s ease;
}

@keyframes searchIn{
  from{
    opacity:0;
    transform:translateY(-8px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

/* FILTER & SORT SHEET */

.uxOverlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.45);
  z-index:9998;
  display:none;
}

.uxOverlay.show{
  display:block;
}

.uxSheet{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  max-height:82vh;
  background:#fff;
  border-radius:24px 24px 0 0;
  z-index:9999;
  padding:14px 18px 24px;
  overflow:auto;
  box-shadow:0 -8px 30px rgba(0,0,0,.2);
  animation:sheetUp .25s ease;
}

@keyframes sheetUp{
  from{
    transform:translateY(100%);
  }
  to{
    transform:translateY(0);
  }
}

.sheetHandle{
  width:42px;
  height:5px;
  background:#bbb;
  border-radius:10px;
  margin:0 auto 14px;
}

.sheetHeader{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:14px;
}

.sheetHeader strong{
  font-size:22px;
}

.sheetClose{
  border:0;
  background:none;
  font-size:28px;
  cursor:pointer;
}

.filterTabs{
  display:flex;
  gap:8px;
  margin-bottom:12px;
}

.filterTab{
  flex:1;
  padding:12px 8px;
  border:1px solid #ddd;
  background:#fff;
  border-radius:12px;
  font-size:15px;
}

.filterTab.active{
  background:#171717;
  color:#fff;
}

.filterSearch{
  width:100%;
  box-sizing:border-box;
  padding:13px 15px;
  border:1px solid #ddd;
  border-radius:12px;
  font-size:16px;
  margin-bottom:10px;
}

.filterList{
  max-height:45vh;
  overflow:auto;
}

.filterOption{
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px 2px;
  font-size:16px;
}

.filterOption input{
  width:20px;
  height:20px;
}

.sheetAction{
  width:100%;
  padding:14px;
  border:0;
  border-radius:12px;
  background:#171717;
  color:#fff;
  font-size:16px;
  margin-top:14px;
}

.sheetReset{
  width:100%;
  padding:13px;
  border:1px solid #ddd;
  border-radius:12px;
  background:#fff;
  font-size:16px;
  margin-top:8px;
}
/* MOBILE TOOLS */

.mobileTools{
  display:flex;
  gap:10px;
  margin:0 0 14px;
}
.mobileTools{
  position:sticky;
  top:0;
  z-index:20;
  background:#f6f7f9;
  padding-top:8px;
  padding-bottom:8px;
}
.toolBtn{
  flex:1;
  min-height:52px;
  border:1px solid #ddd;
  background:#fff;
  border-radius:14px;
  padding:8px 10px;
  font-size:14px;
  cursor:pointer;
}

.toolIcon{
  display:block;
  font-size:22px;
  margin-bottom:3px;
}

.toolBtn:active{
  transform:scale(.98);
}


/* SEARCH */

.searchHidden{
  display:none;
}

.search.searchVisible{
  display:block;
}


/* FILTER & SORT OVERLAY */

.uxOverlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.45);
  z-index:1000;
  display:flex;
  align-items:flex-end;
  justify-content:center;
}

.uxSheet{
  width:100%;
  max-width:700px;
  max-height:88vh;
  overflow-y:auto;
  background:#fff;
  border-radius:22px 22px 0 0;
  padding:18px;
  box-sizing:border-box;
  animation:sheetUp .2s ease;
}

@keyframes sheetUp{
  from{
    transform:translateY(100%);
  }
  to{
    transform:translateY(0);
  }
}


/* SHEET HEADER */

.sheetHeader{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding-bottom:14px;
  margin-bottom:8px;
  border-bottom:1px solid #eee;
  font-size:18px;
}

.sheetHeader button{
  border:0;
  background:none;
  font-size:22px;
  cursor:pointer;
}


/* FILTER */

.filterGroup{
  margin:14px 0;
}

.filterGroup label{
  display:block;
  font-weight:bold;
  margin-bottom:7px;
}

.filterGroup select{
  width:100%;
  padding:13px;
  border:1px solid #ddd;
  border-radius:12px;
  background:#fff;
  font-size:15px;
}

.sheetReset{
  width:100%;
  padding:13px;
  margin-top:8px;
  border:1px solid #ddd;
  border-radius:12px;
  background:#f7f7f7;
  font-size:15px;
}


/* SORT */

.sortOption{
  width:100%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:18px 4px;
  border:0;
  border-bottom:1px solid #eee;
  background:#fff;
  font-size:16px;
  text-align:left;
  cursor:pointer;
}

.sortOption:active{
  background:#f5f5f5;
}


/* MOBILE */

@media(max-width:700px){

  .mobileTools{
    margin-left:0;
    margin-right:0;
  }

  .toolBtn{
    min-height:58px;
    font-size:14px;
  }

  .uxSheet{
    max-height:88vh;
    padding:16px;
  }

}
  
 /* ===== LAYOUT KATALOG LAMA ===== */

/* ===== DESKTOP FILTER KIRI ===== */

@media(min-width:701px){

  #grid{

  }

  #filterSheet{

    content:"Filters";

  }

  #filterSheet{

  }

  }

/* =================================================
   PREMIUM DESIGN - HEADER & PRODUCT CARD
   ================================================= */

:root{
  --premium-blue:#1769d1;
  --premium-blue-dark:#102a4c;
  --premium-text:#172033;
  --premium-muted:#718096;
  --premium-bg:#f7f9fc;
  --premium-border:#e8edf3;
}

/* BODY */
body{
  background:var(--premium-bg);
  color:var(--premium-text);
  font-family:Arial,sans-serif;
}

/* ================= HEADER ================= */

header{
  height:76px !important;
  padding:8px 18px !important;
  background:rgba(255,255,255,.96) !important;
  border-bottom:1px solid #edf0f4 !important;
  box-shadow:0 2px 15px rgba(16,42,76,.06);
  backdrop-filter:blur(10px);
}

.logoArea{
  min-width:0;
  flex:1;
}

.logoPlaceholder{
  display:flex;
  align-items:center;
  gap:10px;
  min-width:0;
}

.logoPlaceholder img{
  width:48px !important;
  height:48px !important;
  border-radius:12px;
  object-fit:contain;
  background:#fff;
  flex-shrink:0;
}

.logoPlaceholder span{
  font-size:19px;
  font-weight:700;
  color:var(--premium-blue-dark);
  letter-spacing:-.3px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

/* TOMBOL HEADER */

.headerActions{
  display:flex;
  align-items:center;
  gap:8px;
  flex-shrink:0;
}

.cartHeader,
.adminHeader{
  border:1px solid #e5eaf0 !important;
  background:#fff !important;
  color:var(--premium-blue-dark);
  border-radius:13px !important;
  min-height:46px;
  padding:8px 13px !important;
  font-size:15px;
  box-shadow:0 3px 12px rgba(16,42,76,.06);
}

.cartHeader{
  position:relative;
  min-width:55px;
  font-size:20px;
}

#cartCount{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-width:20px;
  height:20px;
  padding:0 5px;
  margin-left:3px;
  border-radius:20px;
  background:#e53935;
  color:#fff;
  font-size:11px;

<script>

const SUPABASE_URL =
"https://kyzoscnnezuzewvknxuh.supabase.co/rest/v1/";

const SUPABASE_KEY =
"sb_publishable_-TmUC7SdNF6m4fTLEasIGg_YFfEYcaP";

let data=[];
let isAdmin=false;
let selectedCategory="Semua";
let currentSort="relevance";
  async function loadSiteSettings(){

  try{

    const r = await fetch(
      SUPABASE_URL + "site_settings?id=eq.1&select=*",
      {
        method:"GET",
        headers:{
          "apikey":SUPABASE_KEY,
          "Authorization":"Bearer "+SUPABASE_KEY
        }
      }
    );

    if(!r.ok) return;

    const rows = await r.json();

    if(!rows.length) return;

    const settings = rows[0];

    const name = document.getElementById("siteName");

    if(name){
      name.textContent =
        settings.site_name || "Lumbung Pangan Semesta";
    }
const logo = document.getElementById("siteLogo");

if(logo && settings.logo_url){
  logo.src = settings.logo_url;
  logo.style.display = "block";
}
  }catch(e){

    console.error("Gagal memuat pengaturan katalog:",e);

  }

}

function openSearch(){
  const el=document.getElementById("search");
  if(!el)return;

  el.classList.add("searchVisible");
  el.focus();
}

function closeSearch(){
  const el=document.getElementById("search");
  if(!el)return;

  el.value="";
  el.classList.remove("searchVisible");
  render();
}

function openFilter(){
  const el=document.getElementById("filterSheet");
  if(el)el.style.display="flex";
}

function closeFilter(){
  const el=document.getElementById("filterSheet");
  if(el)el.style.display="none";
}

function openSort(){
  const el=document.getElementById("sortSheet");
  if(el)el.style.display="flex";
}

function closeSort(){
  const el=document.getElementById("sortSheet");
  if(el)el.style.display="none";
}

function setSort(type){
  currentSort=type;
  closeSort();
  render();
}

function resetFilters(){
  selectedCategory="Semua";
  currentSort="relevance";

  const search=document.getElementById("search");
  if(search)search.value="";

  const selects=document.querySelectorAll(
    "#filterSheet select"
  );

  selects.forEach(s=>s.value="");

  closeFilter();
  render();
}
async function loadData(){

  try{

    const r=await fetch(
      SUPABASE_URL+"products?select=*",
      {
        method:"GET",
        headers:{
          "apikey":SUPABASE_KEY,
          "Authorization":"Bearer "+SUPABASE_KEY,
          "Content-Type":"application/json"
        }
      }
    );

    if(!r.ok){
      const errorText=await r.text();
      throw new Error("Supabase HTTP "+r.status+": "+errorText);
    }

    const rows=await r.json();

    data=rows.map(x=>({
  id:x.id,
  n:x.name || "",
  b:x.brand || "",
  c:x.category || "",
  p:x.price_ctn || 0,
  i:x.pack || "",
  supplier:x.supplier || "",
tag1:x.tag1 || "",
tag2:x.tag2 || "",
tag3:x.tag3 || "",
pcsEnabled:x.pcs_enabled || false,
pcsMarkup:Number(x.pcs_markup || 0),
img:x.image_url || ""
}));

    render();

  }catch(e){

    console.error(e);

    document.getElementById("grid").innerHTML=
      '<div class="empty">Gagal mengambil data dari Supabase.<br><br>'+
      e.message+'</div>';

  }
}
let adminFilter="Semua";

function renderAdminList(){

  const list=document.getElementById("adminList");
  const count=document.getElementById("adminCount");
  const search=document.getElementById("adminSearch");

  if(!list)return;

  const q=(search?.value||"").toLowerCase().trim();

  const filtered=data.filter(x=>{

    const cocokCari=
      (x.n+" "+x.b+" "+x.supplier+" "+x.c)
      .toLowerCase()
      .includes(q);

    const lengkap=
      x.i &&
      x.supplier &&
      x.c &&
      x.tag1 &&
      x.tag2 &&
      x.tag3;

    if(adminFilter==="Lengkap" && !lengkap)return false;
    if(adminFilter==="Belum" && lengkap)return false;

    return cocokCari;

  });

  count.innerHTML=
    "Total: <b>"+data.length+
    "</b> produk | Ditampilkan: <b>"+
    filtered.length+"</b>";

  if(!filtered.length){

    list.innerHTML=
      '<div class="empty">Tidak ada produk.</div>';

    return;
  }

  list.innerHTML=filtered.map(x=>{

    const lengkap=
      x.i &&
      x.supplier &&
      x.c &&
      x.tag1 &&
      x.tag2 &&
      x.tag3;

    return `

      <div class="adminRow">

        <img
          class="adminThumb"
          src="${esc(x.img||"")}"
          onerror="this.style.display='none'"
        >

        <div class="adminInfo">

          <div class="adminName">
            ${esc(x.n)}
          </div>

          <div>
            Rp ${Number(x.p||0).toLocaleString("id-ID")} / CTN
          </div>

          <div>
            Supplier: ${esc(x.supplier||"-")}
          </div>

          <div>
            Kategori: ${esc(x.c||"-")}
          </div>

          <div>
            Isi: ${esc(x.i||"-")} |
            Tag:
            ${esc(x.tag1||"-")},
            ${esc(x.tag2||"-")},
            ${esc(x.tag3||"-")}
          </div>

          <div class="adminStatus ${
            lengkap ? "statusOk" : "statusMissing"
          }">

            ${
              lengkap
              ? "✅ Lengkap"
              : "⚠️ Belum Lengkap"
            }

          </div>

        </div>

        <button onclick="editProduct(${x.id})">
          ✏️ Edit
        </button>

function render(){

  const searchEl=document.getElementById("search");
  const q=(searchEl?.value||"").toLowerCase().trim();

  const cats=[
    "Semua",
    ...new Set(
      data.map(x=>x.c).filter(Boolean)
    )
  ];

  document.getElementById("cats").innerHTML=
    cats.map(c=>`
      <button
        class="${selectedCategory===c?'active':''}"
        onclick="selectedCategory='${esc(c)}';render()">
        ${esc(c)}
      </button>
    `).join("");

  let filtered=data.filter(x=>{

    const cocokSearch=
      (x.n+" "+x.b+" "+x.supplier)
      .toLowerCase()
      .includes(q);

    const cocokCat=
      selectedCategory==="Semua" ||
      x.c===selectedCategory;

    return cocokSearch && cocokCat;

  });

  /* =========================
     SORTING
     ========================= */

  if(currentSort==="priceLow"){

    filtered.sort(
      (a,b)=>Number(a.p||0)-Number(b.p||0)
    );

  }

  else if(currentSort==="priceHigh"){

    filtered.sort(
      (a,b)=>Number(b.p||0)-Number(a.p||0)
    );

  }

  else if(currentSort==="nameAZ"){

    filtered.sort(
      (a,b)=>
        String(a.n||"").localeCompare(
          String(b.n||""),
          "id",
          {numeric:true}
        )
    );

  }

  else if(currentSort==="nameZA"){

    filtered.sort(
      (a,b)=>
        String(b.n||"").localeCompare(
          String(a.n||""),
          "id",
          {numeric:true}
        )
    );

  }

  /* =========================
     EMPTY
     ========================= */

  if(!filtered.length){

    document.getElementById("grid").innerHTML=
      '<div class="empty">Belum ada produk.</div>';

    return;

  }

  /* =========================
     PRODUCT GRID
     ========================= */

  document.getElementById("grid").innerHTML=

    filtered.map(x=>`

      <article class="card">

        <div class="pic">

          ${
            x.img

              <img
                src="${esc(x.img)}"

            ${esc(x.n)}

            Rp ${Number(x.p||0).toLocaleString("id-ID")} / CTN
          </div>

          ${
            x.i

                Isi: ${esc(x.i)} PACK

                  Number(x.p||0) /
                  Number(x.i||1)

            : ""

          <div style="margin-top:12px">

let cart = [];

function addToCart(id, type){
  const x = data.find(a => a.id === id);
  if(!x) return;

  let price = Number(x.p || 0);

  if(type === "pcs"){
    if(!x.pcsEnabled || !x.i) return;

    const base = price / Number(x.i);
    price = Math.ceil(
      (base * (1 + Number(x.pcsMarkup || 0) / 100)) / 500
    ) * 500;
  }

  const key = id + "-" + type;
  const existing = cart.find(a => a.key === key);

  if(existing){
    existing.qty++;
  }else{
    cart.push({
      key:key,
      id:id,
      name:x.n,
      type:type,
      price:price,
      qty:1
    });
  }

  renderCart();
}

function esc(s){

  return String(s??"")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}

async function saveSettings(){

  if(!isAdmin) return;

  const name =
    document.getElementById("settingsName").value.trim();

  const fileInput =
    document.getElementById("settingsLogoFile");

  const file =
    fileInput.files[0];

  try{

    let logoUrl = "";

    if(file){

      const ext =
        file.name.split(".").pop().toLowerCase();

      const fileName =
        "site-logo." + ext;

      const uploadUrl =
        SUPABASE_URL.replace(
          "/rest/v1/",
          "/storage/v1/object/catalog-assets/"
        ) + fileName;

      const upload =
        await fetch(uploadUrl,{

          method:"POST",

          headers:{
            "apikey":SUPABASE_KEY,
            "Authorization":
              "Bearer " +
              localStorage.getItem("admin_token"),
            "Content-Type":file.type,
            "x-upsert":"true"
          },

          body:file

        });

      if(!upload.ok){
        throw new Error(
          await upload.text()
        );
      }

      logoUrl =
        SUPABASE_URL.replace(
          "/rest/v1/",
          "/storage/v1/object/public/catalog-assets/"
        ) + fileName;

    }else{

      const current =
        await fetch(
          SUPABASE_URL +
          "site_settings?id=eq.1&select=logo_url",
          {
            headers:{
              "apikey":SUPABASE_KEY,
              "Authorization":
                "Bearer " + SUPABASE_KEY
            }
          }
        );

      const rows =
        await current.json();

      logoUrl =
        rows[0]?.logo_url || "";

    }

    await updateSiteSettings(
      name,
      logoUrl
    );

    closeSettings();

    await loadSiteSettings();

  }catch(e){

    console.error(e);

    alert(
      "Gagal menyimpan pengaturan katalog."
    );

  }

}

    r=await fetch(
      SUPABASE_URL+
      "products?id=eq."+
      window.editingProductId,
      {
        method:"PATCH",

        headers:{
          "apikey":SUPABASE_KEY,
          "Authorization":
            "Bearer "+
            localStorage.getItem("admin_token"),
          "Content-Type":"application/json"
        },

        body:JSON.stringify(payload)
      }
    );

  }else{

    r=await fetch(
      SUPABASE_URL+"products",
      {
        method:"POST",

        headers:{
          "apikey":SUPABASE_KEY,
          "Authorization":
            "Bearer "+
            localStorage.getItem("admin_token"),
          "Content-Type":"application/json",
          "Prefer":"return=minimal"
        },

        body:JSON.stringify(payload)
      }
    );

  }


  if(!r.ok){

    alert(
      "Gagal menyimpan produk:\n"+
      await r.text()
    );

    return;
  }


  closeProductForm();

  await loadData();

  alert(
    window.editingProductId
    ? "Produk berhasil diubah."
    : "Produk berhasil ditambahkan."
  );

}
loadSiteSettings();
loadData();

</script>

</html>
