<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Katalog Produk</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f6f7f9;
  color:#171717
}
header{
  background:#fff;
  padding:16px 18px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:1px solid #ddd;
  position:sticky;
  top:0;
  z-index:5
}
main{
  max-width:1100px;
  margin:auto;
  padding:26px 16px
}
.hero{
  background:#171717;
  color:#fff;
  border-radius:26px;
  padding:30px 26px;
  margin-bottom:28px
}
.hero h1{
  margin:0 0 12px;
  font-size:38px
}
.hero p{
  margin:0;
  font-size:18px
}
.search{
  width:100%;
  padding:20px;
  border:1px solid #ddd;
  border-radius:18px;
  font-size:18px;
  margin-bottom:16px
}
.cats{
  display:flex;
  gap:8px;
  overflow:auto;
  margin-bottom:20px
}
.cats button{
  border:1px solid #ddd;
  background:#fff;
  border-radius:12px;
  padding:10px 16px;
  white-space:nowrap
}
.cats button.active{
  background:#171717;
  color:#fff
}
.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:14px
}
.card{
  background:#fff;
  border:1px solid #e3e3e3;
  border-radius:16px;
  overflow:hidden
}
.pic{
  height:180px;
  background:#eee;
  display:flex;
  align-items:center;
  justify-content:center
}
.pic img{
  width:100%;
  height:100%;
  object-fit:contain
}
.cardbody{
  padding:14px
}
.brand{
  color:#777;
  font-size:13px
}
.name{
  font-size:17px;
  font-weight:bold;
  margin:5px 0
}
.price{
  font-size:19px;
  font-weight:bold;
  margin-top:10px
}
.meta{
  color:#666;
  font-size:13px;
  margin-top:6px
}
.empty{
  padding:40px;
  text-align:center;
  color:#777
}
.adminbar{
  display:none;
  gap:8px;
  margin-bottom:20px
}
.adminbar button{
  padding:10px 14px;
  border:0;
  border-radius:10px
}
@media(max-width:700px){
  .grid{grid-template-columns:repeat(2,1fr)}
  .hero h1{font-size:34px}
}
  /* ADMIN FORM */
.adminList{
  margin-top:20px;
}

.adminTools{
  background:#fff;
  border:1px solid #ddd;
  border-radius:16px;
  padding:16px;
  margin-bottom:20px;
}

.adminTools input{
  width:100%;
  box-sizing:border-box;
  padding:12px;
  border:1px solid #ddd;
  border-radius:10px;
  font-size:16px;
  margin-bottom:10px;
}

.adminFilters{
  display:flex;
  gap:8px;
  overflow:auto;
}

.adminFilters button{
  white-space:nowrap;
  padding:9px 12px;
  border:1px solid #ddd;
  border-radius:10px;
  background:#fff;
}

.adminRow{
  background:#fff;
  border:1px solid #ddd;
  border-radius:14px;
  padding:12px;
  margin-bottom:10px;
  display:flex;
  gap:12px;
  align-items:center;
}

.adminThumb{
  width:60px;
  height:60px;
  border-radius:10px;
  object-fit:contain;
  background:#f5f5f5;
}

.adminInfo{
  flex:1;
  min-width:0;
}

.adminName{
  font-weight:bold;
  margin-bottom:5px;
}

.adminStatus{
  font-size:13px;
  margin-top:5px;
}

.statusOK{
  color:green;
}

.statusMissing{
  color:#d97706;
}

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.6);
  display:none;
  align-items:center;
  justify-content:center;
  padding:15px;
  z-index:100;
}

.modalBox{
  background:#fff;
  width:100%;
  max-width:600px;
  max-height:90vh;
  overflow:auto;
  border-radius:18px;
  padding:20px;
  box-sizing:border-box;
}

.formGrid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.formGroup{
  display:flex;
  flex-direction:column;
  gap:5px;
}

.formGroup.full{
  grid-column:1/-1;
}

.formGroup input{
  padding:11px;
  border:1px solid #ccc;
  border-radius:9px;
  font-size:15px;
  box-sizing:border-box;
}

.preview{
  width:100%;
  height:160px;
  object-fit:contain;
  background:#f5f5f5;
  border-radius:10px;
  margin-top:8px;
}

.modalButtons{
  display:flex;
  gap:10px;
  margin-top:16px;
}

.modalButtons button{
  flex:1;
  padding:12px;
  border:0;
  border-radius:10px;
}

@media(max-width:700px){
  .formGrid{
    grid-template-columns:1fr;
  }

  .formGroup.full{
    grid-column:auto;
  }

  .adminRow{
    align-items:flex-start;
  }
}
</style>
</head>

<body>

<header>
  <b>KATALOG ANDA</b>
  <button onclick="adminLogin()">🔒 Admin</button>
</header>

<main>

<section class="hero">
  <h1>Katalog Produk</h1>
  <p>Tambah dan edit produk melalui Admin.</p>
</section>

<div id="adminbar" class="adminbar">
  <button onclick="addProduct()">➕ Tambah Produk</button>
  <button onclick="logout()">Keluar</button>
</div>
<div id="adminPanel" style="display:none">

  <div class="adminTools">

    <b>Daftar Produk Admin</b>

    <div id="adminCount" style="margin:8px 0 12px"></div>

    <input
      id="adminSearch"
      placeholder="🔎 Cari produk..."
      oninput="renderAdminList()"
    >

    <div class="adminFilters">

      <button onclick="adminFilter='Semua';renderAdminList()">
        Semua
      </button>

      <button onclick="adminFilter='Belum';renderAdminList()">
        ⚠️ Belum Lengkap
      </button>

      <button onclick="adminFilter='Lengkap';renderAdminList()">
        ✅ Lengkap
      </button>

    </div>

  </div>

  <div id="adminList" class="adminList"></div>

</div>
  <div id="productModal" class="modal">

  <div class="modalBox">

    <h2 id="formTitle">Tambah Produk</h2>

    <div class="formGrid">

      <div class="formGroup full">
        <label>Nama Produk</label>
        <input id="fName" placeholder="Nama produk">
      </div>

      <div class="formGroup">
        <label>Harga CTN</label>
        <input id="fPrice" type="number" placeholder="Contoh: 258000">
      </div>

      <div class="formGroup">
        <label>Isi per Karton</label>
        <input id="fPack" placeholder="Contoh: 6">
      </div>
<div class="formGroup">
  <label>Penjualan PCS</label>
  <select id="fPcsEnabled">
    <option value="false">OFF — Hanya CTN</option>
    <option value="true">ON — Bisa PCS</option>
  </select>
</div>

<div class="formGroup">
  <label>Markup PCS (%)</label>
  <input
    id="fPcsMarkup"
    type="number"
    min="0"
    step="0.1"
    placeholder="Contoh: 10"
  >
</div>
      <div class="formGroup">
        <label>Supplier</label>
        <input id="fSupplier" placeholder="Nama supplier">
      </div>

      <div class="formGroup">
        <label>Category</label>
        <input id="fCategory" placeholder="Contoh: Minyak Goreng">
      </div>

      <div class="formGroup">
        <label>Tag 1</label>
        <input id="fTag1" placeholder="Tag pertama">
      </div>

      <div class="formGroup">
        <label>Tag 2</label>
        <input id="fTag2" placeholder="Tag kedua">
      </div>

      <div class="formGroup">
        <label>Tag 3</label>
        <input id="fTag3" placeholder="Tag ketiga">
      </div>

      <div class="formGroup full">
        <label>URL Gambar</label>
        <input
          id="fImage"
          placeholder="https://..."
          oninput="previewImage()"
        >

        <img
          id="imagePreview"
          class="preview"
          style="display:none"
        >
      </div>

    </div>

    <div class="modalButtons">

      <button onclick="closeProductForm()">
        Batal
      </button>

      <button onclick="saveProduct()">
        💾 Simpan
      </button>

    </div>

  </div>

</div>
<input
  id="search"
  class="search"
  placeholder="Cari produk..."
  oninput="render()"
>

<div id="cats" class="cats"></div>

<div id="grid" class="grid"></div>

</main>

<script>

const SUPABASE_URL =
"https://kyzoscnnezuzewvknxuh.supabase.co/rest/v1/";

const SUPABASE_KEY =
"sb_publishable_-TmUC7SdNF6m4fTLEasIGg_YFfEYcaP";

let data=[];
let isAdmin=false;
let selectedCategory="Semua";

async function loadData(){

  try{

    const r=await fetch(
      SUPABASE_URL+"products?select=*",
      {
        method:"GET",
        headers:{
          "apikey":SUPABASE_KEY,
          "Authorization":"Bearer "+SUPABASE_KEY,
          "Content-Type":"application/json"
        }
      }
    );

    if(!r.ok){
      const errorText=await r.text();
      throw new Error("Supabase HTTP "+r.status+": "+errorText);
    }

    const rows=await r.json();

    data=rows.map(x=>({
  id:x.id,
  n:x.name || "",
  b:x.brand || "",
  c:x.category || "",
  p:x.price_ctn || 0,
  i:x.pack || "",
  supplier:x.supplier || "",
tag1:x.tag1 || "",
tag2:x.tag2 || "",
tag3:x.tag3 || "",
pcsEnabled:x.pcs_enabled || false,
pcsMarkup:Number(x.pcs_markup || 0),
img:x.image_url || ""
}));

    render();

  }catch(e){

    console.error(e);

    document.getElementById("grid").innerHTML=
      '<div class="empty">Gagal mengambil data dari Supabase.<br><br>'+
      e.message+'</div>';

  }
}
let adminFilter="Semua";

function renderAdminList(){

  const list=document.getElementById("adminList");
  const count=document.getElementById("adminCount");
  const search=document.getElementById("adminSearch");

  if(!list)return;

  const q=(search?.value||"").toLowerCase().trim();

  const filtered=data.filter(x=>{

    const cocokCari=
      (x.n+" "+x.b+" "+x.supplier+" "+x.c)
      .toLowerCase()
      .includes(q);

    const lengkap=
      x.i &&
      x.supplier &&
      x.c &&
      x.tag1 &&
      x.tag2 &&
      x.tag3;

    if(adminFilter==="Lengkap" && !lengkap)return false;
    if(adminFilter==="Belum" && lengkap)return false;

    return cocokCari;

  });

  count.innerHTML=
    "Total: <b>"+data.length+
    "</b> produk | Ditampilkan: <b>"+
    filtered.length+"</b>";

  if(!filtered.length){

    list.innerHTML=
      '<div class="empty">Tidak ada produk.</div>';

    return;
  }

  list.innerHTML=filtered.map(x=>{

    const lengkap=
      x.i &&
      x.supplier &&
      x.c &&
      x.tag1 &&
      x.tag2 &&
      x.tag3;

    return `

      <div class="adminRow">

        <img
          class="adminThumb"
          src="${esc(x.img||"")}"
          onerror="this.style.display='none'"
        >

        <div class="adminInfo">

          <div class="adminName">
            ${esc(x.n)}
          </div>

          <div>
            Rp ${Number(x.p||0).toLocaleString("id-ID")} / CTN
          </div>

          <div>
            Supplier: ${esc(x.supplier||"-")}
          </div>

          <div>
            Kategori: ${esc(x.c||"-")}
          </div>

          <div>
            Isi: ${esc(x.i||"-")} |
            Tag:
            ${esc(x.tag1||"-")},
            ${esc(x.tag2||"-")},
            ${esc(x.tag3||"-")}
          </div>

          <div class="adminStatus ${
            lengkap ? "statusOk" : "statusMissing"
          }">

            ${
              lengkap
              ? "✅ Lengkap"
              : "⚠️ Belum Lengkap"
            }

          </div>

        </div>

        <button onclick="editProduct(${x.id})">
          ✏️ Edit
        </button>

      </div>

    `;

  }).join("");

}
function render(){

  const q=
    document.getElementById("search").value
    .toLowerCase();

  const cats=
    ["Semua",
     ...new Set(
       data.map(x=>x.c).filter(Boolean)
     )
    ];

  document.getElementById("cats").innerHTML=
    cats.map(c=>
      `<button class="${selectedCategory===c?'active':''}"
       onclick="selectedCategory='${esc(c)}';render()">
       ${esc(c)}
       </button>`
    ).join("");

  const filtered=data.filter(x=>{

    const cocokSearch=
      (x.n+" "+x.b).toLowerCase().includes(q);

    const cocokCat=
      selectedCategory==="Semua" ||
      x.c===selectedCategory;

    return cocokSearch && cocokCat;

  });

  if(!filtered.length){

    document.getElementById("grid").innerHTML=
      '<div class="empty">Belum ada produk.</div>';

    return;
  }

  document.getElementById("grid").innerHTML=
    filtered.map(x=>`

      <article class="card">

        <div class="pic">
          ${
            x.img
            ? `<img src="${esc(x.img)}"
                    onerror="this.style.display='none'">`
            : "📦"
          }
        </div>

        <div class="cardbody">

          <div class="brand">${esc(x.b)}</div>

          <div class="name">${esc(x.n)}</div>

          <div class="price">
  Rp ${Number(x.p||0).toLocaleString("id-ID")} / CTN
</div>

${
  x.i
  ? `
    <div class="meta">Isi: ${esc(x.i)} PCS</div>
    <div class="meta">
      Estimasi: Rp ${Math.round(Number(x.p||0)/Number(x.i||1)).toLocaleString("id-ID")} / PCS
    </div>
  `
  : ""
}
${
  `<div style="margin-top:12px">
    <button onclick="addToCart(${x.id},'ctn')">
      🛒 Tambah CTN
    </button>
    ${
      x.pcsEnabled && x.i
      ? `
        <button onclick="addToCart(${x.id},'pcs')">
          🛒 Tambah PCS
        </button>
      `
      : ""
    }
  </div>`
}
          ${
            isAdmin
            ? `<div style="margin-top:12px">
                <button onclick="editProduct(${x.id})">
                  ✏️ Edit
                </button>
                <button onclick="deleteProduct(${x.id})">
                  🗑️ Hapus
                </button>
              </div>`
            : ""
          }

        </div>

      </article>

    `).join("");
}
let cart = [];

function addToCart(id, type){
  const x = data.find(a => a.id === id);
  if(!x) return;

  let price = Number(x.p || 0);

  if(type === "pcs"){
    if(!x.pcsEnabled || !x.i) return;

    const base = price / Number(x.i);
    price = Math.ceil(
      (base * (1 + Number(x.pcsMarkup || 0) / 100)) / 500
    ) * 500;
  }

  const key = id + "-" + type;
  const existing = cart.find(a => a.key === key);

  if(existing){
    existing.qty++;
  }else{
    cart.push({
      key:key,
      id:id,
      name:x.n,
      type:type,
      price:price,
      qty:1
    });
  }

  renderCart();
}
  function renderCart(){

  const el = document.getElementById("cart");

  if(!el) return;

  if(!cart.length){
    el.innerHTML = '<div class="empty">Keranjang masih kosong.</div>';
    return;
  }

  let total = 0;

  el.innerHTML = cart.map((x,i)=>{

    const subtotal = x.price * x.qty;
    total += subtotal;

    return `
      <div class="cartItem">

        <div>
          <div class="cartName">${esc(x.name)}</div>

          <div class="cartMeta">
            ${x.type === "pcs" ? "PCS" : "CTN"}
            × ${x.qty}
          </div>

          <div class="cartPrice">
            Rp ${Number(x.price).toLocaleString("id-ID")}
          </div>
        </div>

        <div>
          <strong>
            Rp ${subtotal.toLocaleString("id-ID")}
          </strong>

          <button onclick="cart.splice(${i},1);renderCart()">
            🗑️
          </button>
        </div>

      </div>
    `;

  }).join("");

  el.innerHTML += `
    <div class="cartTotal">
      <strong>Total</strong>
      <strong>Rp ${total.toLocaleString("id-ID")}</strong>
    </div>

    <button onclick="checkoutCart()">
      🛒 Checkout
    </button>
  `;
}
  function checkoutCart(){

  if(!cart.length){
    alert("Keranjang masih kosong.");
    return;
  }

  let pesan = "Halo, saya ingin memesan:%0A%0A";
  let total = 0;

  cart.forEach((x,i)=>{

    const subtotal = x.price * x.qty;
    total += subtotal;

    pesan +=
      (i+1) + ". " + x.name +
      "%0A" +
      "   " + (x.type === "pcs" ? "PCS" : "CTN") +
      " × " + x.qty +
      " = Rp " + subtotal.toLocaleString("id-ID") +
      "%0A%0A";
  });

  pesan +=
    "TOTAL: Rp " +
    total.toLocaleString("id-ID") +
    "%0A%0A" +
    "Mohon konfirmasi pesanan saya. Terima kasih.";

  const nomor = "6282242246066";

  window.open(
    "https://wa.me/" + nomor + "?text=" + pesan,
    "_blank"
  );
}
function esc(s){

  return String(s??"")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}

async function adminLogin(){

  const email=prompt("Email admin:");
  if(!email)return;

  const password=prompt("Password admin:");
  if(!password)return;

  try{

    const r=await fetch(
      "https://kyzoscnnezuzewvknxuh.supabase.co/auth/v1/token?grant_type=password",
      {
        method:"POST",
        headers:{
          "apikey":SUPABASE_KEY,
          "Content-Type":"application/json"
        },
        body:JSON.stringify({
          email:email,
          password:password
        })
      }
    );

    const result=await r.json();

    if(!r.ok){
      alert("Login gagal: "+(result.error_description||result.msg||"Email atau password salah"));
      return;
    }

    localStorage.setItem("admin_token",result.access_token);

    isAdmin=true;
document.getElementById("adminbar").style.display="flex";
document.getElementById("adminPanel").style.display="block";
renderAdminList();
render();

  }catch(e){

    alert("Gagal terhubung ke Supabase");

  }
}

function logout(){

  localStorage.removeItem("admin_token");

  isAdmin=false;
document.getElementById("adminbar").style.display="none";
document.getElementById("adminPanel").style.display="none";
render();

  }

function addProduct(){

  if(!isAdmin)return;

  document.getElementById("formTitle").textContent="Tambah Produk";

  document.getElementById("fName").value="";
  document.getElementById("fPrice").value="";
  document.getElementById("fPack").value="";
  document.getElementById("fPcsEnabled").value="false";
document.getElementById("fPcsMarkup").value="0";
  document.getElementById("fSupplier").value="";
  document.getElementById("fCategory").value="";
  document.getElementById("fTag1").value="";
  document.getElementById("fTag2").value="";
  document.getElementById("fTag3").value="";
  document.getElementById("fImage").value="";
  document.getElementById("imagePreview").style.display="none";

  window.editingProductId=null;

  document.getElementById("productModal").style.display="flex";
}
function editProduct(id){

  const x=data.find(a=>a.id==id);

  if(!x)return;

  document.getElementById("formTitle").textContent="Edit Produk";

  document.getElementById("fName").value=x.n || "";
  document.getElementById("fPrice").value=x.p || "";
  document.getElementById("fPack").value=x.i || "";
  document.getElementById("fPcsEnabled").value=x.pcsEnabled ? "true" : "false";
document.getElementById("fPcsMarkup").value=x.pcsMarkup || 0;
  document.getElementById("fSupplier").value=x.supplier || "";
  document.getElementById("fCategory").value=x.c || "";
  document.getElementById("fTag1").value=x.tag1 || "";
  document.getElementById("fTag2").value=x.tag2 || "";
  document.getElementById("fTag3").value=x.tag3 || "";
  document.getElementById("fImage").value=x.img || "";

  window.editingProductId=id;

  previewImage();

  document.getElementById("productModal").style.display="flex";
    }

async function deleteProduct(id){

  if(!confirm("Hapus produk ini?"))return;

  const r=await fetch(
    SUPABASE_URL+"products?id=eq."+id,
    {
      method:"DELETE",
      headers:{
        "apikey":SUPABASE_KEY,
        "Authorization":"Bearer "+localStorage.getItem("admin_token"),
      }
    }
  );

  if(!r.ok){

    alert("Gagal menghapus:\n"+await r.text());
    return;

  }

  await loadData();

}
function previewImage(){

  const url=document.getElementById("fImage").value.trim();
  const img=document.getElementById("imagePreview");

  if(url){
    img.src=url;
    img.style.display="block";
  }else{
    img.src="";
    img.style.display="none";
  }
}


function closeProductForm(){

  document.getElementById("productModal").style.display="none";

}


async function saveProduct(){

  if(!isAdmin)return;

  const name=document.getElementById("fName").value.trim();

  if(!name){
    alert("Nama produk wajib diisi.");
    return;
  }

  const payload={

    name:name,

    brand:document.getElementById("fSupplier").value.trim(),

    supplier:document.getElementById("fSupplier").value.trim(),

    category:document.getElementById("fCategory").value.trim(),

    price_ctn:Number(
      document.getElementById("fPrice").value
    ) || 0,

    pack:document.getElementById("fPack").value.trim(),

pcs_enabled:document.getElementById("fPcsEnabled").value === "true",

pcs_markup:Number(
  document.getElementById("fPcsMarkup").value
) || 0,

tag1:document.getElementById("fTag1").value.trim(),
    tag2:document.getElementById("fTag2").value.trim(),

    tag3:document.getElementById("fTag3").value.trim(),

    image_url:document.getElementById("fImage").value.trim()

  };


  let r;


  if(window.editingProductId){

    r=await fetch(
      SUPABASE_URL+
      "products?id=eq."+
      window.editingProductId,
      {
        method:"PATCH",

        headers:{
          "apikey":SUPABASE_KEY,
          "Authorization":
            "Bearer "+
            localStorage.getItem("admin_token"),
          "Content-Type":"application/json"
        },

        body:JSON.stringify(payload)
      }
    );

  }else{

    r=await fetch(
      SUPABASE_URL+"products",
      {
        method:"POST",

        headers:{
          "apikey":SUPABASE_KEY,
          "Authorization":
            "Bearer "+
            localStorage.getItem("admin_token"),
          "Content-Type":"application/json",
          "Prefer":"return=minimal"
        },

        body:JSON.stringify(payload)
      }
    );

  }


  if(!r.ok){

    alert(
      "Gagal menyimpan produk:\n"+
      await r.text()
    );

    return;
  }


  closeProductForm();

  await loadData();

  alert(
    window.editingProductId
    ? "Produk berhasil diubah."
    : "Produk berhasil ditambahkan."
  );

}
loadData();

</script>

</body>
</html>
