<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Katalog Produk</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f6f7f9;
  color:#171717
}
header{
  background:#fff;
  padding:16px 18px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:1px solid #ddd;
  position:sticky;
  top:0;
  z-index:5
}
main{
  max-width:1100px;
  margin:auto;
  padding:26px 16px
}
.hero{
  background:#171717;
  color:#fff;
  border-radius:26px;
  padding:30px 26px;
  margin-bottom:28px
}
.hero h1{
  margin:0 0 12px;
  font-size:38px
}
.hero p{
  margin:0;
  font-size:18px
}
.search{
  width:100%;
  padding:20px;
  border:1px solid #ddd;
  border-radius:18px;
  font-size:18px;
  margin-bottom:16px;
  position:sticky;
  top:64px;
  z-index:10;
  background:#f6f7f9;
}
.search{
  display:none;
}

.search.searchVisible{
  display:block;
}  
.cats{
  display:flex;
  gap:8px;
  overflow:auto;
  margin-bottom:20px;
  position:sticky;
  top:145px;
  z-index:9;
  background:#f6f7f9;
  padding:6px 0 10px;
}
.cats button{
  border:1px solid #ddd;
  background:#fff;
  border-radius:12px;
  padding:10px 16px;
  white-space:nowrap
}
.cats button.active{
  background:#171717;
  color:#fff
}
.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:14px
}
.card{
  background:#fff;
  border:1px solid #e3e3e3;
  border-radius:16px;
  overflow:hidden
}
.pic{
  height:180px;
  background:#eee;
  display:flex;
  align-items:center;
  justify-content:center
}
.pic img{
  width:100%;
  height:100%;
  object-fit:contain
}
.cardbody{
  padding:14px
}
.brand{
  color:#777;
  font-size:13px
}
.name{
  font-size:17px;
  font-weight:bold;
  margin:5px 0
}
.price{
  font-size:19px;
  font-weight:bold;
  margin-top:10px
}
.meta{
  color:#666;
  font-size:13px;
  margin-top:6px
}
  .cart{
  background:#fff;
  border:1px solid #ddd;
  border-radius:16px;
  padding:16px;
  margin-bottom:20px;
}
/* KERANJANG HANYA MUNCUL SAAT IKON DIKLIK */
.cart{
  display:none;
}

.cart.cartOpen{
  display:block;
}
.cart:empty{
  display:none;
}

.cartItem{
  padding:14px 0;
  border-bottom:1px solid #eee;
  display:flex;
  gap:12px;
  align-items:center;
}

.cartImage{
  width:75px;
  height:75px;
  flex-shrink:0;
  background:#f5f5f5;
  border-radius:10px;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  font-size:28px;
}

.cartImage img{
  width:100%;
  height:100%;
  object-fit:contain;
}

.cartInfo{
  flex:1;
  min-width:0;
}

.cartName{
  font-weight:bold;
  font-size:15px;
  margin-bottom:5px;
}

.cartMeta{
  color:#666;
  font-size:13px;
  margin-bottom:4px;
}

.cartPrice{
  font-size:13px;
  color:#666;
}

.cartSubtotal{
  font-weight:bold;
  font-size:15px;
  margin-top:5px;
}

.cartDelete{
  flex-shrink:0;
  padding:8px 10px;
}

.cartTotal{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-top:16px;
  padding-top:12px;
  border-top:2px solid #eee;
}
.empty{
  padding:40px;
  text-align:center;
  color:#777
}
.adminbar{
  display:none;
  gap:8px;
  margin-bottom:20px
}
.adminbar button{
  padding:10px 14px;
  border:0;
  border-radius:10px
}
@media(max-width:700px){
  .grid{grid-template-columns:repeat(2,1fr)}
  .hero h1{font-size:34px}
}
  /* ADMIN FORM */
.adminList{
  margin-top:20px;
}

.adminTools{
  background:#fff;
  border:1px solid #ddd;
  border-radius:16px;
  padding:16px;
  margin-bottom:20px;
}

.adminTools input{
  width:100%;
  box-sizing:border-box;
  padding:12px;
  border:1px solid #ddd;
  border-radius:10px;
  font-size:16px;
  margin-bottom:10px;
}

.adminFilters{
  display:flex;
  gap:8px;
  overflow:auto;
}

.adminFilters button{
  white-space:nowrap;
  padding:9px 12px;
  border:1px solid #ddd;
  border-radius:10px;
  background:#fff;
}

.adminRow{
  background:#fff;
  border:1px solid #ddd;
  border-radius:14px;
  padding:12px;
  margin-bottom:10px;
  display:flex;
  gap:12px;
  align-items:center;
}

.adminThumb{
  width:60px;
  height:60px;
  border-radius:10px;
  object-fit:contain;
  background:#f5f5f5;
}

.adminInfo{
  flex:1;
  min-width:0;
}

.adminName{
  font-weight:bold;
  margin-bottom:5px;
}

.adminStatus{
  font-size:13px;
  margin-top:5px;
}

.statusOK{
  color:green;
}

.statusMissing{
  color:#d97706;
}

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.6);
  display:none;
  align-items:center;
  justify-content:center;
  padding:15px;
  z-index:100;
}

.modalBox{
  background:#fff;
  width:100%;
  max-width:600px;
  max-height:90vh;
  overflow:auto;
  border-radius:18px;
  padding:20px;
  box-sizing:border-box;
}

.formGrid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.formGroup{
  display:flex;
  flex-direction:column;
  gap:5px;
}

.formGroup.full{
  grid-column:1/-1;
}

.formGroup input{
  padding:11px;
  border:1px solid #ccc;
  border-radius:9px;
  font-size:15px;
  box-sizing:border-box;
}

.preview{
  width:100%;
  height:160px;
  object-fit:contain;
  background:#f5f5f5;
  border-radius:10px;
  margin-top:8px;
}

.modalButtons{
  display:flex;
  gap:10px;
  margin-top:16px;
}

.modalButtons button{
  flex:1;
  padding:12px;
  border:0;
  border-radius:10px;
}

@media(max-width:700px){
  .formGrid{
    grid-template-columns:1fr;
  }

  .formGroup.full{
    grid-column:auto;
  }

  .adminRow{
    align-items:flex-start;
  }
}
 /* ===== MOBILE UX TOOLBAR ===== */

.mobileTools{
  display:flex;
  gap:12px;
  margin:0 0 14px;
}

.toolBtn{
  flex:1;
  min-height:64px;
  border:1px solid #ddd;
  background:#fff;
  border-radius:16px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:4px;
  font-size:13px;
  cursor:pointer;
  transition:.2s;
}

.toolBtn:active{
  transform:scale(.97);
}

.toolIcon{
  font-size:25px;
  line-height:1;
}

.toolBtn.active{
  border-color:#1683ff;
  background:#eef7ff;
  color:#0878ef;
}

#search{
  transition:.25s;
}

.searchHidden{
  display:none !important;
}

.searchVisible{
  display:block !important;
  animation:searchIn .2s ease;
}

@keyframes searchIn{
  from{
    opacity:0;
    transform:translateY(-8px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

/* FILTER & SORT SHEET */

.uxOverlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.45);
  z-index:9998;
  display:none;
}

.uxOverlay.show{
  display:block;
}

.uxSheet{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  max-height:82vh;
  background:#fff;
  border-radius:24px 24px 0 0;
  z-index:9999;
  padding:14px 18px 24px;
  overflow:auto;
  box-shadow:0 -8px 30px rgba(0,0,0,.2);
  animation:sheetUp .25s ease;
}

@keyframes sheetUp{
  from{
    transform:translateY(100%);
  }
  to{
    transform:translateY(0);
  }
}

.sheetHandle{
  width:42px;
  height:5px;
  background:#bbb;
  border-radius:10px;
  margin:0 auto 14px;
}

.sheetHeader{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:14px;
}

.sheetHeader strong{
  font-size:22px;
}

.sheetClose{
  border:0;
  background:none;
  font-size:28px;
  cursor:pointer;
}

.filterTabs{
  display:flex;
  gap:8px;
  margin-bottom:12px;
}

.filterTab{
  flex:1;
  padding:12px 8px;
  border:1px solid #ddd;
  background:#fff;
  border-radius:12px;
  font-size:15px;
}

.filterTab.active{
  background:#171717;
  color:#fff;
}

.filterSearch{
  width:100%;
  box-sizing:border-box;
  padding:13px 15px;
  border:1px solid #ddd;
  border-radius:12px;
  font-size:16px;
  margin-bottom:10px;
}

.filterList{
  max-height:45vh;
  overflow:auto;
}

.filterOption{
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px 2px;
  font-size:16px;
}

.filterOption input{
  width:20px;
  height:20px;
}

.sheetAction{
  width:100%;
  padding:14px;
  border:0;
  border-radius:12px;
  background:#171717;
  color:#fff;
  font-size:16px;
  margin-top:14px;
}

.sheetReset{
  width:100%;
  padding:13px;
  border:1px solid #ddd;
  border-radius:12px;
  background:#fff;
  font-size:16px;
  margin-top:8px;
}
/* MOBILE TOOLS */

.mobileTools{
  display:flex;
  gap:10px;
  margin:0 0 14px;
}
.mobileTools{
  position:sticky;
  top:0;
  z-index:20;
  background:#f6f7f9;
  padding-top:8px;
  padding-bottom:8px;
}
.toolBtn{
  flex:1;
  min-height:52px;
  border:1px solid #ddd;
  background:#fff;
  border-radius:14px;
  padding:8px 10px;
  font-size:14px;
  cursor:pointer;
}

.toolIcon{
  display:block;
  font-size:22px;
  margin-bottom:3px;
}

.toolBtn:active{
  transform:scale(.98);
}


/* SEARCH */

.searchHidden{
  display:none;
}

.search.searchVisible{
  display:block;
}


/* FILTER & SORT OVERLAY */

.uxOverlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.45);
  z-index:1000;
  display:flex;
  align-items:flex-end;
  justify-content:center;
}

.uxSheet{
  width:100%;
  max-width:700px;
  max-height:88vh;
  overflow-y:auto;
  background:#fff;
  border-radius:22px 22px 0 0;
  padding:18px;
  box-sizing:border-box;
  animation:sheetUp .2s ease;
}

@keyframes sheetUp{
  from{
    transform:translateY(100%);
  }
  to{
    transform:translateY(0);
  }
}


/* SHEET HEADER */

.sheetHeader{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding-bottom:14px;
  margin-bottom:8px;
  border-bottom:1px solid #eee;
  font-size:18px;
}

.sheetHeader button{
  border:0;
  background:none;
  font-size:22px;
  cursor:pointer;
}


/* FILTER */

.filterGroup{
  margin:14px 0;
}

.filterGroup label{
  display:block;
  font-weight:bold;
  margin-bottom:7px;
}

.filterGroup select{
  width:100%;
  padding:13px;
  border:1px solid #ddd;
  border-radius:12px;
  background:#fff;
  font-size:15px;
}

.sheetReset{
  width:100%;
  padding:13px;
  margin-top:8px;
  border:1px solid #ddd;
  border-radius:12px;
  background:#f7f7f7;
  font-size:15px;
}


/* SORT */

.sortOption{
  width:100%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:18px 4px;
  border:0;
  border-bottom:1px solid #eee;
  background:#fff;
  font-size:16px;
  text-align:left;
  cursor:pointer;
}

.sortOption:active{
  background:#f5f5f5;
}


/* MOBILE */

@media(max-width:700px){

  .mobileTools{
    margin-left:0;
    margin-right:0;
  }

  .toolBtn{
    min-height:58px;
    font-size:14px;
  }

  .uxSheet{
    max-height:88vh;
    padding:16px;
  }

}
  
 /* ===== LAYOUT KATALOG LAMA ===== */

/* HEADER TETAP */
header{
  position:fixed !important;

}

/* KONTEN UTAMA */

  max-width:none;

/* ===== DESKTOP FILTER KIRI ===== */

@media(min-width:701px){

  /* ruang untuk sidebar */
  #grid{
    margin-left:300px;
  }

  /* FILTER SELALU TERSEDIA DI KIRI */
  #filterSheet{
    display:block !important;

    animation:none;
  }

    content:"Filters";
    display:block;

    margin-bottom:15px;
  }

  /* overlay transparan di desktop */
  #filterSheet{
    background:#fff;
  }

  /* SORT tetap berupa popup */
  #sortSheet{
    z-index:7000;
  }

  /* ADMIN tetap bisa tampil normal */
  #adminPanel{
    position:relative;
    z-index:20;
  }
}

/* ===== MOBILE ===== */

@media(max-width:700px){

  body{

  /* ===== SEARCH BOX ===== */

.searchBox{
  position:relative;
  width:100%;
}

.searchBox .search{

}

.searchClose{

  /* CART PANEL - MUNCUL SAAT IKON DIKLIK */

 /* RAPikan HEADER MOBILE */

<body>

<header>
  <div class="logoArea">
    <div class="logoPlaceholder">
  <img id="siteLogo" src="" alt="Logo">
  <span id="siteName">Lumbung Pangan Semesta</span>
    </div>
  </div>

  <div class="headerActions">
    <button class="cartHeader" onclick="openCart()">
      🛒
      <span id="cartCount">0</span>
    </button>

    <button class="adminHeader" onclick="adminLogin()">🔒 Admin</button>
  </div>
</header>

<main>

<section class="hero">
  <h1>Katalog Produk</h1>
  <p>Tambah dan edit produk melalui Admin.</p>
</section>

<div id="adminbar" class="adminbar">
  <button onclick="addProduct()">➕ Tambah Produk</button>
  <button onclick="openSettings()">⚙️ Pengaturan Katalog</button>
  <button onclick="logout()">Keluar</button>
</div>
<div id="adminPanel" style="display:none">

  <div class="adminTools">

    <b>Daftar Produk Admin</b>

    <div id="adminCount" style="margin:8px 0 12px"></div>

    <div class="adminFilters">

      <button onclick="adminFilter='Semua';renderAdminList()">
        Semua
      </button>

      <button onclick="adminFilter='Belum';renderAdminList()">
        ⚠️ Belum Lengkap
      </button>

      <button onclick="adminFilter='Lengkap';renderAdminList()">
        ✅ Lengkap
      </button>

    </div>

  </div>

  <div id="adminList" class="adminList"></div>

</div>
  <div id="productModal" class="modal">

  <div class="modalBox">

    <h2 id="formTitle">Tambah Produk</h2>

    <div class="formGrid">

      <div class="formGroup full">
        <label>Nama Produk</label>
        <input id="fName" placeholder="Nama produk">
      </div>

      <div class="formGroup">
        <label>Harga CTN</label>
        <input id="fPrice" type="number" placeholder="Contoh: 258000">
      </div>

      <div class="formGroup">
        <label>Isi per Karton</label>
        <input id="fPack" placeholder="Contoh: 6">
      </div>
<div class="formGroup">
  <label>Penjualan PACK</label>
  <select id="fPcsEnabled">
    <option value="false">OFF — Hanya CTN</option>
    <option value="true">ON — Bisa PACK</option>
  </select>
</div>

<div class="formGroup">
  <label>Markup PACK (%)</label>

let cart = [];

function addToCart(id, type){
  const x = data.find(a => a.id === id);
  if(!x) return;

  let price = Number(x.p || 0);

  if(type === "pcs"){
    if(!x.pcsEnabled || !x.i) return;

    const base = price / Number(x.i);
    price = Math.ceil(
      (base * (1 + Number(x.pcsMarkup || 0) / 100)) / 500
    ) * 500;
  }

  const key = id + "-" + type;
  const existing = cart.find(a => a.key === key);

  if(existing){
    existing.qty++;
  }else{
    cart.push({
      key:key,
      id:id,
      name:x.n,
      type:type,
      price:price,
      qty:1
    });
  }

  renderCart();
}

` + cart.map((x,i)=>{

                if(cart[${i}].qty <= 0){

    `;

  }).join("");

  el.innerHTML += `

          method:"POST",

          headers:{
            "apikey":SUPABASE_KEY,
            "Authorization":
              "Bearer " +
              localStorage.getItem("admin_token"),
            "Content-Type":file.type,
            "x-upsert":"true"
          },

          body:file

        });

      if(!upload.ok){
        throw new Error(
          await upload.text()
        );
      }

      logoUrl =
        SUPABASE_URL.replace(
          "/rest/v1/",
          "/storage/v1/object/public/catalog-assets/"
        ) + fileName;

    }else{

      const current =
        await fetch(
          SUPABASE_URL +
          "site_settings?id=eq.1&select=logo_url",
          {
            headers:{
              "apikey":SUPABASE_KEY,
              "Authorization":
                "Bearer " + SUPABASE_KEY
            }
          }
        );

      const rows =
        await current.json();

      logoUrl =
        rows[0]?.logo_url || "";

    }

    await updateSiteSettings(
      name,
      logoUrl
    );

    closeSettings();

    await loadSiteSettings();

  }catch(e){

    console.error(e);

    alert(
      "Gagal menyimpan pengaturan katalog."
    );

  }

}
  async function updateSiteSettings(name, logo){

  try{

    const r = await fetch(
      SUPABASE_URL + "site_settings?id=eq.1",
      {
        method:"PATCH",
        headers:{
          "apikey":SUPABASE_KEY,
          "Authorization":"Bearer " + localStorage.getItem("admin_token"),
          "Content-Type":"application/json",
          "Prefer":"return=minimal"
        },
        body:JSON.stringify({
          site_name:name || "Lumbung Pangan Semesta",
          logo_url:logo || ""
        })
      }
    );

    if(!r.ok){
      throw new Error(await r.text());
    }

    const siteName =
      document.getElementById("siteName");

    if(siteName){
      siteName.textContent =
        name || "Lumbung Pangan Semesta";
    }

    alert("Pengaturan katalog berhasil disimpan.");

  }catch(e){

    console.error(e);

    alert("Gagal menyimpan pengaturan katalog.");

  }

}
function editProduct(id){

  const x=data.find(a=>a.id==id);

  if(!x)return;

  document.getElementById("formTitle").textContent="Edit Produk";

  document.getElementById("fName").value=x.n || "";
  document.getElementById("fPrice").value=x.p || "";
  document.getElementById("fPack").value=x.i || "";
  document.getElementById("fPcsEnabled").value=x.pcsEnabled ? "true" : "false";
document.getElementById("fPcsMarkup").value=x.pcsMarkup || 0;
  document.getElementById("fSupplier").value=x.supplier || "";
  document.getElementById("fCategory").value=x.c || "";
  document.getElementById("fTag1").value=x.tag1 || "";
  document.getElementById("fTag2").value=x.tag2 || "";
  document.getElementById("fTag3").value=x.tag3 || "";
  document.getElementById("fImage").value=x.img || "";

  window.editingProductId=id;

  previewImage();

  document.getElementById("productModal").style.display="flex";
    }

async function deleteProduct(id){

  if(!confirm("Hapus produk ini?"))return;

  const r=await fetch(
    SUPABASE_URL+"products?id=eq."+id,
    {
      method:"DELETE",
      headers:{
        "apikey":SUPABASE_KEY,
        "Authorization":"Bearer "+localStorage.getItem("admin_token"),
      }
    }
  );

  if(!r.ok){

    alert("Gagal menghapus:\n"+await r.text());
    return;

  }

  await loadData();

}
function previewImage(){

  const url=document.getElementById("fImage").value.trim();
  const img=document.getElementById("imagePreview");

  if(url){
    img.src=url;
    img.style.display="block";
  }else{
    img.src="";
    img.style.display="none";
  }
}


function closeProductForm(){

  document.getElementById("productModal").style.display="none";

}


async function saveProduct(){

  if(!isAdmin)return;

  const name=document.getElementById("fName").value.trim();

  if(!name){
    alert("Nama produk wajib diisi.");
    return;
  }

  const payload={

    name:name,

    brand:document.getElementById("fSupplier").value.trim(),

    supplier:document.getElementById("fSupplier").value.trim(),

    category:document.getElementById("fCategory").value.trim(),

    price_ctn:Number(
      document.getElementById("fPrice").value
    ) || 0,

    pack:document.getElementById("fPack").value.trim(),

pcs_enabled:document.getElementById("fPcsEnabled").value === "true",

pcs_markup:Number(
  document.getElementById("fPcsMarkup").value
) || 0,

tag1:document.getElementById("fTag1").value.trim(),
    tag2:document.getElementById("fTag2").value.trim(),

    tag3:document.getElementById("fTag3").value.trim(),

    image_url:document.getElementById("fImage").value.trim()

  };


  let r;


  if(window.editingProductId){

    r=await fetch(
      SUPABASE_URL+
      "products?id=eq."+
      window.editingProductId,
      {
        method:"PATCH",

        headers:{
          "apikey":SUPABASE_KEY,
          "Authorization":
            "Bearer "+
            localStorage.getItem("admin_token"),
          "Content-Type":"application/json"
        },

        body:JSON.stringify(payload)
      }
    );

  }else{

    r=await fetch(
      SUPABASE_URL+"products",
      {
        method:"POST",

        headers:{
          "apikey":SUPABASE_KEY,
          "Authorization":
            "Bearer "+
            localStorage.getItem("admin_token"),
          "Content-Type":"application/json",
          "Prefer":"return=minimal"
        },

        body:JSON.stringify(payload)
      }
    );

  }


  if(!r.ok){

    alert(
      "Gagal menyimpan produk:\n"+
      await r.text()
    );

    return;
  }


  closeProductForm();

  await loadData();

  alert(
    window.editingProductId
    ? "Produk berhasil diubah."
    : "Produk berhasil ditambahkan."
  );

}
